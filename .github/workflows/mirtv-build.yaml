# MirTV : fabrication de l'appli (non signée) à chaque envoi sur la branche « mirtv ».
# La signature se fait ensuite sur le VPS de RAHISS (la clé ne quitte jamais le serveur) :
# scripts/build-apk.sh du dépôt « mirtv » télécharge l'APK de la « release » GitHub, le signe et le publie.
name: MirTV / Fabrication

on:
  push:
    branches:
      - mirtv
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mirtv-build
  cancel-in-progress: false

jobs:
  build:
    name: Fabrication de l'APK MirTV
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version-file: .tools-versions
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Version MirTV
        # versionCode = AAMMJJNN (année, mois, jour, numéro de fabrication du jour sur 2 chiffres)
        run: |
          NN=$(printf '%02d' $(( GITHUB_RUN_NUMBER % 100 )))
          echo "MIRTV_VERSION_CODE=$(date -u +%y%m%d)${NN}" >> "$GITHUB_ENV"
          echo "MIRTV_VERSION_NAME=0.1.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
      - name: Nom MirTV dans les textes
        run: python3 mirtv/outils/marque.py && python3 mirtv/outils/marque.py --verifier
      - name: Assemble release APK (non signé)
        run: ./gradlew --no-daemon assembleRelease
      - name: Préparer l'APK
        run: |
          mkdir -p sortie
          f=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          cp "$f" "sortie/mirtv-${MIRTV_VERSION_NAME}-${MIRTV_VERSION_CODE}-non-signe.apk"
          (cd sortie && sha256sum *.apk > SHA256SUMS)
          echo "versionCode=${MIRTV_VERSION_CODE}" > sortie/version.txt
          echo "versionName=${MIRTV_VERSION_NAME}" >> sortie/version.txt
          echo "commit=${GITHUB_SHA}" >> sortie/version.txt
      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mirtv-${{ env.MIRTV_VERSION_CODE }}
          retention-days: 30
          if-no-files-found: error
          path: sortie/
      - name: Publier la version (APK non signé)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "mirtv-${MIRTV_VERSION_CODE}" sortie/* \
            --target "${GITHUB_SHA}" --prerelease \
            --title "MirTV ${MIRTV_VERSION_NAME} (${MIRTV_VERSION_CODE}) — non signé" \
            --notes "APK non signé, fabriqué depuis ${GITHUB_SHA}. Il est signé et publié par le serveur MirTV (canal test). Code source : ce dépôt, licence GPL v2."

  emulateur:
    name: Test de démarrage Android ${{ matrix.api }}
    runs-on: ubuntu-26.04
    needs: build
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [23, 28, 34]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Télécharger l'APK fabriqué
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mirtv-*
          path: telecharge
          merge-multiple: true
      - name: Signer avec une clé jetable (test seulement)
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          keytool -genkeypair -keystore jetable.jks -storepass jetable -keypass jetable -alias t -keyalg RSA -keysize 2048 -validity 2 -dname "CN=test"
          "$BT/apksigner" sign --ks jetable.jks --ks-pass pass:jetable --key-pass pass:jetable --out mirtv-test.apk telecharge/*-non-signe.apk
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Émulateur Android et test
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash mirtv/outils/test-emulateur.sh mirtv-test.apk
      - name: Captures et journal
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-emulateur-android-${{ matrix.api }}
          retention-days: 14
          path: sortie-test/
