# MirTV : installe dans un émulateur l'APK réellement publié (canal test) et le lance.
name: MirTV / Test de l'APK publié

on:
  workflow_dispatch:
    inputs:
      canal:
        description: "Canal à tester (test ou stable)"
        default: test
  schedule:
    - cron: '47 3 * * *'

jobs:
  installer:
    name: Android ${{ matrix.api }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [28, 34]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Émulateur Android et test
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash mirtv/outils/test-apk-publie.sh ${{ github.event.inputs.canal || 'test' }}
      - name: Captures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk-publie-android-${{ matrix.api }}
          retention-days: 14
          path: sortie-test/
